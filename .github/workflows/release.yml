# Đăng PyPI bằng trusted publishing (OIDC) — không có khoá đăng nào trong kho — kèm chứng nhận nguồn gốc (PEP 740).
#   tag vX.Y.Z (nhánh main) ⇒ bản ổn định, tạo GitHub Release
#   nhánh next (bản X.Y.ZbN)   ⇒ bản xem trước (pip install --pre)
# Biến kho PUBLISH_ENABLED khác "true" ⇒ chỉ dựng + kiểm, không đăng.
name: release
on:
  push:
    tags: ["v*"]
    branches: [next]
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs: { version: "${{ steps.v.outputs.version }}", skip: "${{ steps.v.outputs.skip }}" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: Xác định bản
        id: v
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "::error::tag $GITHUB_REF_NAME ≠ pyproject $v"; exit 1; }
            case "$v" in *[ab]*|*rc*) echo "::error::tag ổn định mà bản là pre-release"; exit 1;; esac
          else
            case "$v" in *b[0-9]*) ;; *) echo "::error::nhánh next phải mang bản XbN (đang $v)"; exit 1;; esac
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/nextfarm-sdk/$v/json")
          if [ "$code" = 200 ]; then echo "Đã có nextfarm-sdk $v — bỏ qua"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: bash codegen/verify.sh
      - run: python -m pip install -q build==1.3.0 twine==6.1.0 pytest==8.3.4
      - run: python -m build && twine check --strict dist/*
      - run: pip install -q dist/*.whl && cd /tmp && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    if: needs.build.outputs.skip != '1' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
  github-release:
    needs: [build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: dist, path: dist/ }
      - env: { GH_TOKEN: "${{ github.token }}", V: "${{ needs.build.outputs.version }}" }
        run: |
          (cd dist && shasum -a 256 * > SHA256SUMS)
          awk -v v="$V" '$0 ~ "^## "v"( |$)"{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" dist/* --title "v$V" --notes-file notes.md --verify-tag
