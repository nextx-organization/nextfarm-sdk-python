# Kiểm mỗi lần mã sinh được đẩy sang: mã khớp openapi.json (không ai sửa tay), dựng bánh xe, test trên Python 3.11–3.13.
name: ci
on:
  push: { branches: [main, next] }
  pull_request:
permissions: { contents: read }
jobs:
  khop-ma-sinh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: bash codegen/verify.sh
  test:
    runs-on: ubuntu-24.04
    strategy: { matrix: { python: ["3.11", "3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -q build==1.3.0 twine==6.1.0 pytest==8.3.4
      - run: python -m build && twine check --strict dist/*
      - run: pip install -q dist/*.whl && cd /tmp && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests"
